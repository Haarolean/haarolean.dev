name: Deploy to Pages

on:
  push:
    branches: [ 'main' ]
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.location.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch location
        id: location
        env:
          NOMADS_KEY: ${{ secrets.NOMADLIST_TOKEN }}
        run: node scripts/location.mjs

  deploy:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NOMADS_KEY: ${{ secrets.NOMADLIST_TOKEN }}
        run: |
          node scripts/location.mjs
          pnpm build
          cp src/location.json dist/

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
